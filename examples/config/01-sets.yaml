sets:
  system:
    include: [/boot, /etc, /opt, /root, /srv, /usr/share, /var]
    exclude: [/var/run]

  home:
    include: [/home/user]
    exclude: [/home/user/tmp, /home/user/projects]

  projects:
    include: [/home/user/projects]
    exclude:
      - "**/venv"
      - "**/node_modules"
      - "**/*.bak"
