# Off-site copies of the system repo, one per restic backend (see docs/backends.md).
# Secrets come from the daemon's environment (for example EnvironmentFile= in the systemd unit),
# files with keys are referenced by path.

repos:
  system-rest:
    # credentials in the URL are per repo, unlike RESTIC_REST_USERNAME / RESTIC_REST_PASSWORD
    path: rest:https://backup:${REST_PASSWORD}@rest.backups.lan:8000/system/
    password: ${SYSTEM_REST_PASSWORD}
    from: system-local
    env:
      RESTIC_CACERT: /etc/rescade/rest-ca.pem
    retention: { daily: 30, weekly: 12 }

  system-s3:
    path: s3:s3.eu-central-1.amazonaws.com/example-backups/system
    password: ${SYSTEM_S3_PASSWORD}
    from: system-local
    env:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    options:
      s3.region: eu-central-1
      s3.storage-class: STANDARD_IA
    retention: { weekly: 12, monthly: 24 }

  system-minio:
    path: s3:https://minio.backups.lan:9000/system
    password: ${SYSTEM_MINIO_PASSWORD}
    from: system-local
    env:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
    options:
      s3.bucket-lookup: path

  system-b2:
    path: b2:example-backups:system
    password: ${SYSTEM_B2_PASSWORD}
    from: system-local
    env:
      B2_ACCOUNT_ID: ${B2_KEY_ID}
      B2_ACCOUNT_KEY: ${B2_APPLICATION_KEY}

  system-azure:
    path: azure:system-backups:/
    password: ${SYSTEM_AZURE_PASSWORD}
    from: system-local
    env:
      AZURE_ACCOUNT_NAME: examplebackups
      AZURE_ACCOUNT_KEY: ${AZURE_ACCOUNT_KEY}
    options:
      azure.access-tier: Cool

  system-gs:
    path: gs:example-backups:/system
    password: ${SYSTEM_GS_PASSWORD}
    from: system-local
    env:
      GOOGLE_PROJECT_ID: "123123123123"
      GOOGLE_APPLICATION_CREDENTIALS: /etc/rescade/gcs-service-account.json

  system-swift:
    path: swift:system-backups:/
    password: ${SYSTEM_SWIFT_PASSWORD}
    from: system-local
    env:
      OS_AUTH_URL: https://auth.cloud.example/v3
      OS_REGION_NAME: RegionOne
      OS_APPLICATION_CREDENTIAL_ID: ${SWIFT_CREDENTIAL_ID}
      OS_APPLICATION_CREDENTIAL_SECRET: ${SWIFT_CREDENTIAL_SECRET}

  system-rclone:
    # rclone reads a whole remote from RCLONE_CONFIG_<REMOTE>_<KEY>, so it needs no rclone.conf
    path: rclone:offsite:backups/system
    password: ${SYSTEM_RCLONE_PASSWORD}
    from: system-local
    env:
      RCLONE_CONFIG_OFFSITE_TYPE: drive
      RCLONE_CONFIG_OFFSITE_TOKEN: ${RCLONE_DRIVE_TOKEN}

cascades:
  offsite:
    description: Nightly copy of the system repo to every off-site backend
    schedule: "30 2 * * *"
    on-busy: wait
    wait-timeout: 2h
    steps:
      - copy: { from: system-local, to: system-rest }
      - retain: { repo: system-rest }
      - copy: { from: system-local, to: system-s3 }
      - retain: { repo: system-s3 }
      - copy: { from: system-local, to: system-minio }
      - copy: { from: system-local, to: system-b2 }
      - copy: { from: system-local, to: system-azure }
      - copy: { from: system-local, to: system-gs }
      - copy: { from: system-local, to: system-swift }
      - copy: { from: system-local, to: system-rclone }
